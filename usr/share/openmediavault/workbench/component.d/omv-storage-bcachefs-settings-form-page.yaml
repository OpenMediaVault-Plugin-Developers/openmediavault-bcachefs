version: "1.0"
type: component
data:
  name: omv-storage-bcachefs-settings-form-page
  type: formPage
  config:
    request:
      service: Bcachefs
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: divider
        title: _("Kernel module")
      - type: hint
        hintType: info
        text: _("A prebuilt bcachefs module from module.bcachefs.org is installed for your running kernel ({{ kernelVersion }}, {{ arch }}). No local build is required.")
        modifiers:
          - type: hidden
            constraint:
              operator: ne
              arg0:
                prop: moduleSource
              arg1: prebuilt
      - type: hint
        hintType: info
        text: _("The bcachefs module is built locally with DKMS for your running kernel ({{ kernelVersion }}, {{ arch }}) and rebuilds on every kernel update. Prebuilt modules are published for Debian amd64 and arm64 kernels, so the Proxmox kernel always uses DKMS. The module builds as C and needs only the matching kernel headers — no Rust toolchain is required.")
        modifiers:
          - type: hidden
            constraint:
              operator: or
              arg0:
                operator: ne
                arg0:
                  prop: moduleSource
                arg1: dkms
              arg1:
                operator: falsy
                arg0:
                  prop: moduleBuilt
      - type: hint
        hintType: error
        text: _("DKMS is installed but no bcachefs module was built for your running kernel ({{ kernelVersion }}, {{ arch }}). Check the build log under /var/lib/dkms/bcachefs/*/build/make.log — the usual cause is missing or mismatched kernel headers for this kernel.")
        modifiers:
          - type: hidden
            constraint:
              operator: or
              arg0:
                operator: ne
                arg0:
                  prop: moduleSource
                arg1: dkms
              arg1:
                operator: truthy
                arg0:
                  prop: moduleBuilt
      - type: hint
        hintType: warning
        text: _("No bcachefs kernel module is installed for your running kernel ({{ kernelVersion }}, {{ arch }}). Apply changes to install one — a prebuilt module where available, otherwise DKMS.")
        modifiers:
          - type: hidden
            constraint:
              operator: ne
              arg0:
                prop: moduleSource
              arg1: none
      - type: hint
        hintType: warning
        text: _("The bcachefs module is installed but not currently loaded. A reboot may be required to load it.")
        modifiers:
          - type: hidden
            constraint:
              operator: or
              arg0:
                operator: truthy
                arg0:
                  prop: moduleLoaded
              arg1:
                operator: falsy
                arg0:
                  prop: moduleBuilt
      - type: divider
        title: _("Repository")
      - type: select
        name: suite
        label: _("Package suite")
        value: "bcachefs-tools-release"
        hint: _("Changing the suite will reinstall bcachefs-tools from the selected repository on the next Apply.")
        store:
          data:
            - ["bcachefs-tools-release", _("bcachefs-tools-release — stable builds (best for production use)")]
            - ["bcachefs-tools-snapshot", _("bcachefs-tools-snapshot — latest builds, updated often (best for testing and development)")]
        validators:
          required: true
    buttons:
      - template: submit
      - template: cancel
